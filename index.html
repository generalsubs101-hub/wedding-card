<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#faf9f5}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Fatimazahra &amp; Momen</title>
<link id="fontlink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&amp;family=Dancing+Script:wght@500&amp;family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Aref+Ruqaa:wght@400;700&amp;family=Amiri:ital@0;1&amp;display=swap">
<style id="mainstyle">
  :root{
    color-scheme: light;
    --paper:#FBFAF5; --ink:#2A3A4A; --ink-soft:#6B746F; --gold:#8A6E35; --gold-soft:#B8A06A;
    --line:rgba(120,130,110,.18);
    --script:"Pinyon Script","Aref Ruqaa",cursive;
    --hand:"Dancing Script","Amiri",cursive;
    --serif:"Cormorant Garamond","Amiri",Georgia,serif;
    --ui: system-ui,-apple-system,"Segoe UI",sans-serif;
    --ed:#1F3A2E; --sel:#C2922E;
  }
  [lang="ar"]{ --script:"Aref Ruqaa","Pinyon Script",serif; --hand:"Amiri","Dancing Script",serif; --serif:"Amiri","Cormorant Garamond",serif; }
  *{box-sizing:border-box} [hidden]{display:none!important}
  body{background:#E9E6DC;color:var(--ink);font-family:var(--serif);margin:0}
  .wrap{max-width:440px;margin:0 auto;background:var(--paper);min-height:100vh;position:relative;box-shadow:0 0 60px rgba(60,60,40,.12);overflow:hidden}
  @media (min-width:900px){
    .wrap{max-width:none;box-shadow:none}
    .it > .in{max-width:640px;margin:0 auto}
    .rsvp form{max-width:360px}
  }
  .lang{position:absolute;top:14px;inset-inline-end:14px;z-index:6;display:flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.6);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.7)}
  .lang button{border:0;background:none;font:500 13px var(--serif);padding:6px 14px;border-radius:999px;color:var(--ink-soft);cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--gold);color:#fff}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* Sections */
  .sec{position:relative;display:flex;flex-direction:column;align-items:stretch;padding:56px 20px;background-size:cover;background-position:center;overflow:hidden}
  .sec.pat{background-image:repeating-linear-gradient(100deg,transparent 0 46px,var(--line) 46px 47px),repeating-linear-gradient(80deg,transparent 0 46px,var(--line) 46px 47px)}
  .sec .wash{position:absolute;inset:0;background:#fff;pointer-events:none}
  .sec .garden,.sec canvas.bloom{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .sec.glow .it{text-shadow:0 1px 16px rgba(255,255,255,.9)}
  .it{position:relative;z-index:2;display:flex;justify-content:center;text-align:center}
  .it.al-left{justify-content:flex-start;text-align:start}
  .it.al-right{justify-content:flex-end;text-align:end}
  .it > .in{max-width:100%}
  [data-k]{white-space:pre-line;overflow-wrap:anywhere}

  .tx{margin:0;font-size:var(--fs)}
  .tx.script{font-family:var(--script);line-height:1.15}
  [lang="ar"] .tx.script{line-height:1.6;font-size:calc(var(--fs)*.9)}
  .tx.hand{font-family:var(--hand);line-height:1.35;text-wrap:balance}
  .tx.eyebrow{font-family:var(--serif);font-weight:500;letter-spacing:.32em;text-transform:uppercase}
  [lang="ar"] .tx.eyebrow{letter-spacing:0;font-size:calc(var(--fs) + 3px)}
  .tx.body{font-family:var(--serif);line-height:1.45}
  .div svg,.div img{display:block;width:100%;height:auto}
  .imgit img{display:block;width:100%;height:auto}
  .imgit.round img{border-radius:14px}
  .spacer{width:100%}

  .cd{display:flex;justify-content:center;gap:34px;font-variant-numeric:tabular-nums}
  .cd > div{display:flex;flex-direction:column;align-items:center}
  .cd b{font-family:var(--script);font-weight:400;font-size:var(--fs);color:var(--gold);line-height:1.1;min-width:1.6ch}
  .cd span{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
  [lang="ar"] .cd span{letter-spacing:0;font-size:14px}
  .link{display:inline-flex;align-items:center;gap:8px;color:var(--ink);font-size:16px;text-decoration:none;border-bottom:1px dotted var(--ink-soft)}
  .link svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5}
  .dir{display:inline-block;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);text-decoration:none}
  [lang="ar"] .dir{letter-spacing:0;font-size:15px}

  .btn{border:0;background:var(--gold);color:#fff;font:500 14px var(--serif);letter-spacing:.2em;padding:15px 30px;border-radius:999px;cursor:pointer}
  .btn:hover{background:#735a28}
  .rsvp{display:flex;flex-direction:column;align-items:center;width:100%}
  .rsvp form{margin:22px auto 0;width:100%;max-width:320px;display:grid;gap:14px;text-align:start}
  .rsvp label{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
  [lang="ar"] .rsvp label{letter-spacing:0;font-size:15px}
  .rsvp form input,.rsvp form select{width:100%;margin-top:6px;font:17px var(--serif);color:var(--ink);background:#fff;border:1px solid #DDD8C8;border-radius:10px;padding:10px 12px}
  .choice{display:flex;gap:10px}
  .choice button{flex:1;padding:12px;border-radius:10px;border:1px solid #DDD8C8;background:#fff;font:16px var(--serif);color:var(--ink);cursor:pointer}
  .choice button[aria-pressed="true"]{border-color:var(--gold);background:#F5EEDC;color:var(--gold)}
  .thanks{font-family:var(--script);font-size:34px;color:var(--gold);margin:22px 0 0}

  /* ---------- Editor (people who can edit only) ---------- */
  .fab{position:fixed;z-index:40;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 18px;background:var(--ed);color:#fff;font:600 14px var(--ui);box-shadow:0 6px 20px rgba(0,0,0,.2);cursor:pointer}
  .ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .editing .sec{outline:1px dashed rgba(31,58,46,.25);outline-offset:-1px;cursor:pointer}
  .editing .sec.sel{outline:2px solid var(--ed);outline-offset:-2px}
  .editing .it{cursor:pointer;min-height:14px}
  .editing .it:hover{outline:1px dashed rgba(194,146,46,.7);outline-offset:2px}
  .editing .it.sel{outline:2px solid var(--sel);outline-offset:2px;z-index:5}
  .editing [data-k]{cursor:text}
  .editing [data-k]:focus{outline:none;background:rgba(255,255,255,.7);border-radius:3px}
  .editing [data-k]:empty::before{content:"Type here";opacity:.4}
  .editing .spacer{background:repeating-linear-gradient(45deg,rgba(31,58,46,.07) 0 6px,transparent 6px 12px);border-radius:4px}
  .tb{position:absolute;z-index:8;top:-42px;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:3px;background:var(--ed);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.25);direction:ltr;text-shadow:none}
  .tb button{width:32px;height:30px;border:0;border-radius:7px;background:none;color:#fff;display:grid;place-items:center;cursor:pointer}
  .tb button:hover{background:rgba(255,255,255,.15)}
  .tb .drag{cursor:grab;touch-action:none}
  .tb .drag:active{cursor:grabbing}
  .tb.below{top:auto;bottom:-42px}

  .panel{position:fixed;z-index:50;left:0;right:0;bottom:0;height:46vh;display:flex;flex-direction:column;background:#fff;color:#1d2622;font:14px var(--ui);
    border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);padding-bottom:env(safe-area-inset-bottom,0px)}
  .panel.min{height:auto}
  .panel.min .pbody{display:none}
  @media (min-width:960px){
    .panel{left:auto;right:16px;top:16px;bottom:16px;width:360px;height:auto;border-radius:16px}
    .panel.min{bottom:auto}
    .editing-page .wrap{margin-right:max(calc((100vw - 440px)/2), 400px)}
  }
  .phead{display:flex;align-items:center;gap:6px;padding:12px 14px;border-bottom:1px solid #ECEAE3;flex-wrap:wrap}
  .phead h2{font:600 15px var(--ui);margin:0;margin-inline-end:auto}
  @media (max-width:959px){ .phead h2{flex-basis:100%} .phead [data-do="cancel"]{margin-inline-start:auto} }
  .pbody{overflow:auto;padding:14px;display:grid;gap:14px;align-content:start;flex:1}
  .pbtn{border:1px solid #CFCBBE;background:#fff;color:#1d2622;border-radius:8px;padding:8px 12px;font:600 13px var(--ui);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .pbtn:hover{background:#F6F4EE}
  .pbtn.primary{background:var(--ed);border-color:var(--ed);color:#fff}
  .pbtn.danger{color:#A23B2C;border-color:#E3C3BC}
  .pbtn.icon{padding:8px}
  .pbtn[aria-pressed="true"]{background:#EAF0EC;border-color:var(--ed)}
  .pbtn:disabled{opacity:.45;cursor:default}
  .grp{display:grid;gap:8px}
  .grp > .lbl{font:600 12px var(--ui);color:#5d6660;text-transform:uppercase;letter-spacing:.06em}
  .rowb{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .panel select,.panel input[type=text],.panel input[type=datetime-local]{font:14px var(--ui);padding:8px 10px;border:1px solid #D6D3C8;border-radius:8px;width:100%;color:#1d2622;background:#fff}
  .panel input[type=range]{width:100%;accent-color:var(--ed)}
  .panel input[type=color]{width:36px;height:32px;padding:0;border:1px solid #D6D3C8;border-radius:8px;background:none}
  .sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #CFCBBE;cursor:pointer}
  .sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ed)}
  .dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
  .dgrid button{border:1px solid #DDD9CD;background:#FBFAF5;border-radius:10px;padding:10px 8px;cursor:pointer;color:#6E8B63}
  .dgrid button[aria-pressed="true"]{border-color:var(--ed);box-shadow:0 0 0 1px var(--ed)}
  .dgrid svg,.dgrid img{width:100%;height:24px;object-fit:contain;display:block}
  .hint{margin:0;color:#5d6660;font-size:13px;line-height:1.45}
  .status{font-size:13px;color:#5d6660}
  .thumb{width:56px;height:56px;border-radius:8px;background:#EEF0EA center/cover;border:1px solid #D6D3C8;flex:none}
  .editing .wrap{padding-bottom:48vh}
  @media (min-width:960px){ .editing .wrap{padding-bottom:0} }

  /* Hero eyebrow copy: bold in both languages, and keep the closing line on one line, centered */
  .it[data-id="i1"] .tx,
  .it[data-id="i8"] .tx{font-weight:700}
  .it[data-id="i8"] .tx{white-space:nowrap;text-align:center}
  /* Nudge the closing line + heart down toward the image edge, desktop only (mobile's hero is shorter and would clip) */
  @media (min-width:900px){
    .it[data-id="5yn7ir5"]{transform:translate(0px,225px)!important}
    .it[data-id="i8"]{transform:translate(-2px,218px)!important}
  }

  /* ---------- Intro gate (envelope) ---------- */
  html.gate-lock,html.gate-lock body{overflow:hidden;height:100%}
  .gate{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:#EFE6D4;cursor:pointer;transition:opacity .55s ease;padding:20px;perspective:1000px}
  .gate-env{position:relative;width:min(464px,calc(100vw - 48px));aspect-ratio:4/3;transition:transform .15s ease-out}
  .gate-back{position:absolute;inset:0;background:#E0D5C4;border-radius:0 0 10px 10px;box-shadow:0 24px 60px rgba(45,40,25,.28)}
  .gate-pocket{position:absolute;left:0;right:0;bottom:0;height:78%;background:#F1E9DC;clip-path:polygon(0 42%,50% 52%,100% 42%,100% 100%,0 100%);z-index:2}
  .gate-flap{position:absolute;top:0;left:0;right:0;height:64%;background:#D9CBB4;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform 1s cubic-bezier(.4,0,.2,1),opacity .5s ease .35s;box-shadow:0 2px 10px rgba(0,0,0,.08);z-index:3}
  .gate-seal{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:76px;height:76px;z-index:5;filter:drop-shadow(0 8px 16px rgba(31,58,46,.4));transition:transform .55s ease,opacity .45s ease}
  .gate-seal img{width:100%;height:100%;object-fit:contain;display:block}
  .gate-hint{margin:0;font:500 12px var(--serif);letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft);animation:gatePulse 2.2s ease-in-out infinite}
  @keyframes gatePulse{0%,100%{opacity:.5}50%{opacity:1}}
  .gate.opening .gate-flap{transform:rotateX(-165deg);opacity:0}
  .gate.opening .gate-seal{transform:translate(-50%,-50%) scale(.35) rotate(14deg);opacity:0}
  .gate.opening .gate-hint{opacity:0;transition:opacity .3s ease}
  .gate.closed{opacity:0;pointer-events:none}
</style>

<div class="wrap" id="app" lang="en" dir="ltr"></div>

<div id="introGate" class="gate" role="button" tabindex="0" aria-label="Tap to open the invitation">
  <div class="gate-env">
    <div class="gate-back"></div>
    <div class="gate-pocket"></div>
    <div class="gate-seal"><img src="wax-rose-green.png" alt="" draggable="false"></div>
    <div class="gate-flap"></div>
  </div>
  <p class="gate-hint">Tap to open</p>
</div>
<audio id="introSong" src="wedding-song.mp3" preload="auto" loop></audio>
<script>
(function(){
  var gate = document.getElementById('introGate');
  if(!gate) return;
  var env = gate.querySelector('.gate-env');
  var isOpen = false;
  document.documentElement.classList.add('gate-lock');
  function openGate(){
    if(isOpen) return;
    isOpen = true;
    var song = document.getElementById('introSong');
    if(song){ song.currentTime = 0; song.play().catch(function(){}); }
    gate.classList.add('opening');
    setTimeout(function(){
      gate.classList.add('closed');
      document.documentElement.classList.remove('gate-lock');
      setTimeout(function(){ gate.remove(); }, 600);
    }, 950);
    gate.removeEventListener('click', openGate);
  }
  gate.addEventListener('click', openGate);
  gate.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openGate(); }
  });

  // Subtle live tilt toward the pointer/touch, like a card being held
  var raf = null, mx = 0, my = 0;
  function onMove(e){
    if(isOpen) return;
    var p = e.touches ? e.touches[0] : e;
    var cx = window.innerWidth / 2, cy = window.innerHeight / 2;
    mx = (p.clientX - cx) / cx;
    my = (p.clientY - cy) / cy;
    if(!raf) raf = requestAnimationFrame(apply);
  }
  function apply(){
    raf = null;
    if(isOpen || !env) return;
    var rx = (-my * 5).toFixed(2), ry = (mx * 7).toFixed(2);
    env.style.transform = 'rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
  }
  window.addEventListener('mousemove', onMove, {passive:true});
  window.addEventListener('touchmove', onMove, {passive:true});
})();

const uid = () => Math.random().toString(36).slice(2, 9);
const T = (it, k) => (it.txt?.[lang]?.[k] ?? it.txt?.en?.[k] ?? '');
const K = (it, k, tag, cls) => '<' + (tag||'span') + (cls ? ' class="' + cls + '"' : '') + ' data-k="' + k + '">' + esc(T(it,k)) + '</' + (tag||'span') + '>';

/* ---------- Render ---------- */
function eventTime(){ return new Date((S.event || '2026-10-11T20:00') + ':00+03:00'); }
function calHref(){
  const s = eventTime(), e = new Date(s.getTime() + 5*3600e3), f = d => d.toISOString().replace(/[-:]|\.\d{3}/g,'');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(S.title || 'Wedding') + '&dates=' + f(s) + '/' + f(e) + '&location=' + encodeURIComponent(S.maps);
}
function itemHTML(it){
  const al = it.align && it.align !== 'center' ? ' al-' + it.align : '';
  const tr = (it.x || it.y) ? 'transform:translate(' + (it.x||0) + 'px,' + (it.y||0) + 'px);' : '';
  const mt = it.mt ? 'margin-top:' + it.mt + 'px;' : '';
  let inner = '', cls = '';
  switch(it.t){
    case 'text':
      if(!editing && !T(it,'text').trim()) return '';
      inner = '<p class="tx ' + it.style + '" style="--fs:' + it.size + 'px;color:' + (it.color||'inherit') + '" data-k="text">' + esc(T(it,'text')) + '</p>'; break;
    case 'divider':
      cls = ' div';
      inner = it.kind === 'image' && it.img ? '<img src="' + it.img + '" alt="">' : (DIV[it.kind] || DIV.leaf);
      inner = '<div class="in" style="width:' + (it.w||150) + 'px;color:' + (it.color||'#6E8B63') + ';opacity:' + (it.op ?? .9) + (it.flip ? ';transform:scaleY(-1)' : '') + '">' + inner + '</div>';
      return '<div class="it' + cls + al + '" data-id="' + it.id + '" style="' + mt + tr + '">' + inner + '</div>';
    case 'image':
      if(!it.img && !editing) return '';
      inner = it.img ? '<img src="' + it.img + '" alt="">' : '<div style="padding:30px;border:1px dashed #bbb;border-radius:10px;font:13px var(--ui);color:#777">Choose an image in the panel</div>';
      return '<div class="it imgit' + (it.round ? ' round' : '') + al + '" data-id="' + it.id + '" style="' + mt + tr + '"><div class="in" style="width:' + (it.w||100) + '%">' + inner + '</div></div>';
    case 'spacer':
      return '<div class="it" data-id="' + it.id + '" style="' + mt + tr + '"><div class="spacer" style="height:' + (it.h||40) + 'px"></div></div>';
    case 'countdown':
      inner = '<div class="cd" style="--fs:' + (it.size||50) + 'px"><div><b data-cd="d">0</b>' + K(it,'days') + '</div><div><b data-cd="h">0</b>' + K(it,'hours') + '</div><div><b data-cd="m">0</b>' + K(it,'minutes') + '</div></div>'; break;
    case 'calendar':
      inner = '<a class="link" href="' + esc(calHref()) + '" target="_blank" rel="noopener">' + K(it,'label') + ico('cal') + '</a>'; break;
    case 'directions':
      inner = '<a class="dir" href="' + esc(S.maps) + '" target="_blank" rel="noopener">' + K(it,'label') + ' <span aria-hidden="true">' + (lang === 'ar' ? '←' : '→') + '</span></a>'; break;
    case 'rsvp':
      inner = '<div class="rsvp">' +
        (rsvpDone && !editing ? '<p class="thanks">' + esc(T(it, attending ? 'yes' : 'no')) + '</p>' :
        ((rsvpOpen && !editing) ? '' : '<button class="btn" type="button" data-act="open">' + K(it,'btn') + '</button>') +
        ((rsvpOpen || editing) ? '<form novalidate data-form="1"><label><span data-k="fName">' + esc(T(it,'fName')) + '</span><input class="gName" autocomplete="name"></label>' +
          '<div class="choice" role="group"><button type="button" data-act="yes" aria-pressed="' + attending + '">' + K(it,'accept') + '</button><button type="button" data-act="no" aria-pressed="' + !attending + '">' + K(it,'decline') + '</button></div>' +
          (attending ? '<label><span data-k="fGuests">' + esc(T(it,'fGuests')) + '</span><select><option>1</option><option>2</option></select></label>' : '') +
          '<button class="btn" type="submit">' + K(it,'send') + '</button></form>' : '')) + '</div>'; break;
  }
  return '<div class="it' + cls + al + '" data-id="' + it.id + '" style="' + mt + tr + '"><div class="in" style="width:100%">' + inner + '</div></div>';
}
function secHTML(sec){
  const b = sec.bg || {}, st = [];
  st.push('background-color:' + (b.color || 'var(--paper)'));
  if(b.type === 'image' && b.img) st.push('background-image:url(' + b.img + ')');
  if(sec.minH) st.push('min-height:' + sec.minH + 'px');
  if(sec.pad != null) st.push('padding-block:' + sec.pad + 'px');
  const cls = ['sec'];
  if(b.type === 'lines') cls.push('pat');
  if(b.type === 'image' || b.type === 'garden') cls.push('glow');
  let deco = '';
  if(b.type === 'garden') deco = GARDEN + '<canvas class="bloom" aria-hidden="true"></canvas>';
  if((b.type === 'image' || b.type === 'garden') && b.wash) deco += '<div class="wash" style="opacity:' + b.wash/100 + '"></div>';
  return '<section class="' + cls.join(' ') + '" data-sec="' + sec.id + '" style="' + st.join(';') + '">' + deco + sec.items.map(itemHTML).join('') + '</section>';
}
function render(){
  app.lang = lang; app.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = S.title || document.title;
  app.innerHTML = '<div class="lang" role="group" aria-label="Language"><button data-lang="en" aria-pressed="' + (lang==='en') + '">EN</button><button data-lang="ar" aria-pressed="' + (lang==='ar') + '" style="font-family:Amiri,serif">العربية</button></div>' + S.sections.map(secHTML).join('');
  app.querySelectorAll('canvas.bloom').forEach(drawGarden);
  tick();
  if(editing) decorateEdit();
}
function tick(){
  const s = Math.max(0, Math.floor((eventTime() - Date.now())/1000));
  const v = {d: Math.floor(s/86400), h: Math.floor(s%86400/3600), m: Math.floor(s%3600/60)};
  app.querySelectorAll('[data-cd]').forEach(b => b.textContent = v[b.dataset.cd]);
}
setInterval(tick, 20000);

function drawGarden(cv){
  const r = cv.getBoundingClientRect(); if(!r.width) return;
  const cx = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = r.width*dpr; cv.height = r.height*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
  let seed = 42; const R = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const W = r.width, H = r.height;
  function leaf(x,y,a,s){ cx.save(); cx.translate(x,y); cx.rotate(a); cx.fillStyle = `rgba(${90+R()*40},${125+R()*30},${80+R()*25},${.35+R()*.3})`;
    cx.beginPath(); cx.moveTo(0,0); cx.quadraticCurveTo(s*.5,-s*.35,s,0); cx.quadraticCurveTo(s*.5,s*.35,0,0); cx.fill(); cx.restore(); }
  function hyd(x,y,rad){
    for(let i=0;i<7;i++) leaf(x+(R()-.5)*rad*1.6, y+rad*.4+R()*rad*.6, R()*Math.PI*2, rad*(.8+R()*.6));
    const g = cx.createRadialGradient(x,y,0,x,y,rad); g.addColorStop(0,'rgba(255,255,248,.9)'); g.addColorStop(1,'rgba(230,238,215,0)');
    cx.fillStyle = g; cx.beginPath(); cx.arc(x,y,rad*1.1,0,7); cx.fill();
    for(let i=0;i<rad*2.2;i++){ const a=R()*Math.PI*2, d=Math.sqrt(R())*rad, px=x+Math.cos(a)*d, py=y+Math.sin(a)*d*.9, p=2.5+R()*3.5;
      cx.fillStyle = `rgba(${R()<.25?'228,236,208':'255,255,250'},${.75+R()*.25})`; const ro=R()*1.57;
      for(let k=0;k<4;k++){ const t=ro+k*1.57; cx.beginPath(); cx.ellipse(px+Math.cos(t)*p*.55, py+Math.sin(t)*p*.55, p*.7, p*.55, t, 0, 7); cx.fill(); } }
  }
  for(let i=0;i<40;i++){ leaf(R()*W*.25, R()*H*.35, R()*Math.PI*2, 14+R()*22); leaf(W-R()*W*.25, R()*H*.3, R()*Math.PI*2, 14+R()*22); }
  const s = Math.min(1, W/400);
  [[.05,.62,48],[.92,.6,44],[0,.78,60],[.97,.76,58],[.18,.9,54],[.82,.9,56],[.02,.98,50],[.95,1,50]].forEach(([fx,fy,rd]) => hyd(fx*W, fy*H, rd*s*1.1));
}
addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(() => app.querySelectorAll('canvas.bloom').forEach(drawGarden), 150); });

/* ---------- Guest interactions ---------- */
app.addEventListener('click', e => {
  const lb = e.target.closest('[data-lang]');
  if(lb){ lang = lb.dataset.lang; try{ localStorage.setItem('inv-lang', lang); }catch(_){} render(); if(editing) renderPanel(); return; }
  if(editing) return;
  const a = e.target.closest('[data-act]'); if(!a) return;
  if(a.dataset.act === 'open'){ rsvpOpen = true; render(); app.querySelector('.gName')?.focus(); }
  if(a.dataset.act === 'yes' || a.dataset.act === 'no'){ const n = app.querySelector('.gName')?.value; attending = a.dataset.act === 'yes'; render(); const g = app.querySelector('.gName'); if(g && n) g.value = n; }
});
app.addEventListener('submit', e => {
  e.preventDefault(); if(editing) return;
  const g = app.querySelector('.gName');
  if(!g.value.trim()){ g.focus(); g.style.borderColor = '#B5584A'; return; }
  rsvpDone = true; render();
});
render();

/* ================= Editor ================= */
let artifactApi = null, panel = null;
(async () => {
  if(!window.claude || !claude.use) return;
  const [art, user] = await Promise.all([claude.use('artifact'), claude.use('user')]);
  if(!art) return;
  let can = false; try{ can = user ? !!(await user.canEdit()) : false; }catch(e){}
  if(!can) return;
  artifactApi = art; setupEditor();
})();

const find = id => { for(const s of S.sections){ const i = s.items.findIndex(x => x.id === id); if(i > -1) return {sec:s, i, it:s.items[i]}; } return null; };
const secOf = id => S.sections.find(s => s.id === id);
function snap(){ undoStack.push(JSON.stringify(S)); if(undoStack.length > 30) undoStack.shift(); }
function commit(){ render(); renderPanel(); }

function setupEditor(){
  const fab = document.createElement('button');
  fab.className = 'fab'; fab.id = 'editFab'; fab.innerHTML = ico('pen') + '<span>Edit invitation</span>';
  document.body.appendChild(fab);
  panel = document.createElement('div'); panel.className = 'panel'; panel.hidden = true;
  panel.setAttribute('role','dialog'); panel.setAttribute('aria-label','Invitation editor');
  document.body.appendChild(panel);
  fab.onclick = () => { draft = JSON.stringify(S); undoStack = []; editing = true; sel = null; selSec = null; document.body.classList.add('editing','editing-page'); fab.hidden = true; panel.hidden = false; render(); renderPanel(); };

  // selection + prevent navigation while editing
  app.addEventListener('click', e => {
    if(!editing) return;
    if(e.target.closest('a')) e.preventDefault();
    if(e.target.closest('.tb') || e.target.closest('[data-lang]')) return;
    const it = e.target.closest('.it'), sc = e.target.closest('[data-sec]');
    if(it){ if(sel !== it.dataset.id){ sel = it.dataset.id; selSec = find(sel).sec.id; markSel(); renderPanel(); } }
    else if(sc){ sel = null; selSec = sc.dataset.sec; markSel(); renderPanel(); }
  }, true);
  app.addEventListener('submit', e => e.preventDefault(), true);
  // live text edits
  app.addEventListener('input', e => {
    const k = e.target.closest('[data-k]'); if(!k || !editing) return;
    const f = find(k.closest('.it').dataset.id); if(!f) return;
    f.it.txt = f.it.txt || {}; f.it.txt[lang] = f.it.txt[lang] || {};
    f.it.txt[lang][k.dataset.k] = k.innerText.replace(/\n$/, '');
    if(f.it.role === 'name') syncTitle();
  });
  app.addEventListener('focusin', e => { if(editing && e.target.closest('[data-k]') && !e.target._snap){ snap(); e.target._snap = 1; } });
  app.addEventListener('keydown', e => { if(editing && e.key === 'Enter' && e.target.closest('button [data-k], a [data-k], label [data-k]')) e.preventDefault(); });
  app.addEventListener('paste', e => { if(!editing || !e.target.closest('[data-k]')) return; e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain')); });
  // toolbar actions + drag
  app.addEventListener('pointerdown', e => {
    const h = e.target.closest('.tb .drag'); if(!h) return;
    e.preventDefault();
    const el = h.closest('.it'), f = find(el.dataset.id); snap();
    const sx = e.clientX, sy = e.clientY, ox = f.it.x || 0, oy = f.it.y || 0;
    h.setPointerCapture(e.pointerId);
    const mv = ev => { f.it.x = Math.round(ox + ev.clientX - sx); f.it.y = Math.round(oy + ev.clientY - sy); el.style.transform = 'translate(' + f.it.x + 'px,' + f.it.y + 'px)'; };
    const up = () => { h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up); renderPanel(); };
    h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
  });
  app.addEventListener('click', e => {
    const b = e.target.closest('.tb button[data-tb]'); if(!b) return;
    e.stopPropagation(); itemAction(b.dataset.tb);
  });
}
function syncTitle(){
  const names = []; S.sections.forEach(s => s.items.forEach(it => { if(it.role === 'name') names.push((it.txt?.en?.text || '').trim()); }));
  const n = names.filter(Boolean); if(n.length) S.title = n.join(' & ');
}
function decorateEdit(){
  app.querySelectorAll('[data-k]').forEach(el => { try{ el.contentEditable = 'plaintext-only'; }catch(_){ el.contentEditable = 'true'; } el.spellcheck = false; });
  markSel();
}
function markSel(){
  app.querySelectorAll('.it.sel,.sec.sel').forEach(x => x.classList.remove('sel'));
  app.querySelectorAll('.tb').forEach(x => x.remove());
  if(sel){
    const el = app.querySelector('[data-id="' + sel + '"]'); if(!el) return;
    el.classList.add('sel');
    const tb = document.createElement('div'); tb.className = 'tb';
    tb.innerHTML = '<button class="drag" title="Drag to move" aria-label="Drag to move">' + ico('drag') + '</button>' +
      '<button data-tb="up" title="Move up" aria-label="Move up">' + ico('up') + '</button><button data-tb="down" title="Move down" aria-label="Move down">' + ico('down') + '</button>' +
      '<button data-tb="dup" title="Duplicate" aria-label="Duplicate">' + ico('copy') + '</button><button data-tb="del" title="Remove" aria-label="Remove">' + ico('trash') + '</button>';
    if(el.offsetTop < 46) tb.classList.add('below');
    el.appendChild(tb);
  } else if(selSec){ app.querySelector('[data-sec="' + selSec + '"]')?.classList.add('sel'); }
}
function itemAction(a){
  const f = find(sel); if(!f) return; snap();
  const si = S.sections.indexOf(f.sec);
  if(a === 'del'){ f.sec.items.splice(f.i, 1); sel = null; }
  if(a === 'dup'){ const c = JSON.parse(JSON.stringify(f.it)); c.id = uid(); c.role = undefined; f.sec.items.splice(f.i+1, 0, c); sel = c.id; }
  if(a === 'up'){
    if(f.i > 0){ f.sec.items.splice(f.i, 1); f.sec.items.splice(f.i-1, 0, f.it); }
    else if(si > 0){ f.sec.items.splice(f.i, 1); S.sections[si-1].items.push(f.it); selSec = S.sections[si-1].id; }
  }
  if(a === 'down'){
    if(f.i < f.sec.items.length-1){ f.sec.items.splice(f.i, 1); f.sec.items.splice(f.i+1, 0, f.it); }
    else if(si < S.sections.length-1){ f.sec.items.splice(f.i, 1); S.sections[si+1].items.unshift(f.it); selSec = S.sections[si+1].id; }
  }
  commit();
  if(sel) app.querySelector('[data-id="' + sel + '"]')?.scrollIntoView({block:'nearest', behavior:'smooth'});
}

/* ---------- Panel ---------- */
const COLORS = ['#2A3A4A','#6B746F','#8A6E35','#B8A06A','#6E8B63','#4A5A4A','#FFFFFF','#9C4F5A'];
function swatches(cur, act){ return '<div class="rowb">' + COLORS.map(c => '<button class="sw" style="background:' + c + '" data-' + act + '="' + c + '" aria-label="Color ' + c + '" aria-pressed="' + ((cur||'').toLowerCase() === c.toLowerCase()) + '"></button>').join('') +
  '<input type="color" data-' + act + '-custom="1" value="' + (/^#[0-9a-f]{6}$/i.test(cur||'') ? cur : '#2A3A4A') + '" aria-label="Custom color"></div>'; }
function range(label, key, val, min, max, step, unit){ return '<div class="grp"><span class="lbl">' + label + ' <span style="text-transform:none;font-weight:500">' + val + (unit||'') + '</span></span><input type="range" data-rng="' + key + '" min="' + min + '" max="' + max + '" step="' + (step||1) + '" value="' + val + '"></div>'; }

function renderPanel(){
  if(!panel) return;
  const f = sel ? find(sel) : null, sec = !f && selSec ? secOf(selSec) : null;
  let title = 'Page', body = '';
  if(f){
    const it = f.it; title = ({text:'Text',divider:'Divider',image:'Image',spacer:'Spacer',countdown:'Countdown',calendar:'Calendar link',directions:'Directions link',rsvp:'RSVP'})[it.t];
    if(it.t === 'text'){
      body += '<p class="hint">Type directly on the invitation to change the words' + (lang === 'ar' ? ' (Arabic).' : '. Switch to العربية to edit the Arabic version.') + '</p>';
      body += '<div class="grp"><span class="lbl">Style</span><select data-set="style">' + [['script','Script (names, titles)'],['hand','Handwriting'],['eyebrow','Small capitals'],['body','Plain text']].map(o => '<option value="' + o[0] + '"' + (it.style===o[0]?' selected':'') + '>' + o[1] + '</option>').join('') + '</select></div>';
      body += range('Size', 'size', it.size, 10, 90, 1, 'px');
      body += '<div class="grp"><span class="lbl">Color</span>' + swatches(it.color, 'col') + '</div>';
    }
    if(it.t === 'divider'){
      body += '<div class="grp"><span class="lbl">Style</span><div class="dgrid">' + Object.keys(DIV).map(k => '<button data-kind="' + k + '" aria-pressed="' + (it.kind===k) + '" title="' + DIV_NAMES[k] + '">' + DIV[k] + '</button>').join('') +
        (it.img ? '<button data-kind="image" aria-pressed="' + (it.kind==='image') + '" title="Your image"><img src="' + it.img + '" alt=""></button>' : '') + '</div>' +
        '<div class="rowb"><label class="pbtn" for="upDiv">' + ico('plus') + 'Upload your own divider</label><input type="file" id="upDiv" accept="image/*" hidden></div>' +
        '<p class="hint">PNG or SVG with a transparent background looks best.</p></div>';
      body += range('Width', 'w', it.w || 150, 40, 400, 1, 'px');
      body += range('Opacity', 'op', Math.round((it.op ?? .9)*100), 10, 100, 1, '%');
      if(it.kind !== 'image') body += '<div class="grp"><span class="lbl">Color</span>' + swatches(it.color, 'col') + '</div>';
      body += '<div class="rowb"><button class="pbtn" data-toggle="flip" aria-pressed="' + !!it.flip + '">Flip upside down</button></div>';
    }
    if(it.t === 'image'){
      body += '<div class="rowb"><div class="thumb" style="' + (it.img ? 'background-image:url(' + it.img + ')' : '') + '"></div><label class="pbtn" for="upImg">' + ico('plus') + (it.img ? 'Replace image' : 'Upload image') + '</label><input type="file" id="upImg" accept="image/*" hidden></div>';
      body += range('Width', 'w', it.w || 100, 10, 100, 1, '%');
      body += '<div class="rowb"><button class="pbtn" data-toggle="round" aria-pressed="' + !!it.round + '">Rounded corners</button></div>';
    }
    if(it.t === 'spacer') body += range('Height', 'h', it.h || 40, 4, 500, 2, 'px');
    if(it.t === 'countdown') body += '<p class="hint">Counts down to the date and time in Page settings. Tap the labels to rename them.</p>' + range('Number size', 'size', it.size || 50, 20, 90, 1, 'px');
    if(it.t === 'calendar') body += '<p class="hint">Opens Google Calendar with the date, time and location from Page settings.</p>';
    if(it.t === 'directions') body += '<p class="hint">Opens Google Maps. Set the place in Page settings.</p>';
    if(it.t === 'rsvp'){
      body += '<p class="hint">Tap the button and form labels on the invitation to rename them.</p>';
      body += '<div class="grp"><span class="lbl">Thank-you when a guest accepts (' + (lang==='ar'?'Arabic':'English') + ')</span><input type="text" data-txt="yes" value="' + esc(T(it,'yes')) + '"></div>';
      body += '<div class="grp"><span class="lbl">Thank-you when a guest declines</span><input type="text" data-txt="no" value="' + esc(T(it,'no')) + '"></div>';
    }
    if(it.t !== 'spacer') body += '<div class="grp"><span class="lbl">Alignment</span><div class="rowb">' + [['left','Left'],['center','Center'],['right','Right']].map(o => '<button class="pbtn" data-align="' + o[0] + '" aria-pressed="' + ((it.align||'center')===o[0]) + '">' + o[1] + '</button>').join('') + '</div></div>';
    body += range('Space above', 'mt', it.mt || 0, -80, 200, 2, 'px');
    body += '<div class="grp"><span class="lbl">Position</span><p class="hint">Drag the ' + ico('drag') + ' handle above the item to move it freely. Arrows move it up or down, and into the next section at the ends.</p>' +
      '<div class="rowb"><button class="pbtn" data-do="reset"' + (it.x||it.y ? '' : ' disabled') + '>Reset position</button><button class="pbtn" data-do="dup">' + ico('copy') + 'Duplicate</button><button class="pbtn danger" data-do="del">' + ico('trash') + 'Remove</button></div></div>';
  } else if(sec){
    title = 'Section ' + (S.sections.indexOf(sec) + 1);
    const b = sec.bg || {};
    body += '<div class="grp"><span class="lbl">Background</span><div class="rowb">' + [['plain','Color'],['lines','Lines'],['image','Photo'],['garden','Drawn garden']].map(o => '<button class="pbtn" data-bg="' + o[0] + '" aria-pressed="' + ((b.type||'plain')===o[0]) + '">' + o[1] + '</button>').join('') + '</div></div>';
    if(b.type === 'image' || !b.type || b.type === 'plain' || b.type === 'lines') body += '<div class="rowb"><div class="thumb" style="' + (b.img ? 'background-image:url(' + b.img + ')' : 'background:' + (b.color||'#FBFAF5')) + '"></div><label class="pbtn" for="upBg">' + ico('plus') + 'Upload background</label><input type="file" id="upBg" accept="image/*" hidden></div>';
    if(b.type !== 'image' && b.type !== 'garden') body += '<div class="grp"><span class="lbl">Color</span>' + swatches(b.color, 'bgcol') + '<div class="rowb">' + ['#FBFAF5','#F4EFE3','#E8EEEA','#EEE7EA','#1F3A2E'].map(c => '<button class="sw" style="background:' + c + '" data-bgcol="' + c + '" aria-label="Color ' + c + '"></button>').join('') + '</div></div>';
    if(b.type === 'image' || b.type === 'garden') body += range('White wash (for readable text)', 'wash', b.wash || 0, 0, 80, 1, '%');
    body += range('Minimum height', 'minH', sec.minH || 0, 0, 1000, 10, 'px');
    body += range('Top and bottom padding', 'pad', sec.pad ?? 56, 0, 160, 2, 'px');
    body += '<div class="grp"><span class="lbl">Add to this section</span>' + addButtons() + '</div>';
    body += '<div class="grp"><span class="lbl">Arrange</span><div class="rowb"><button class="pbtn" data-sdo="up">' + ico('up') + 'Move up</button><button class="pbtn" data-sdo="down">' + ico('down') + 'Move down</button><button class="pbtn" data-sdo="dup">' + ico('copy') + 'Duplicate</button><button class="pbtn danger" data-sdo="del">' + ico('trash') + 'Remove section</button></div></div>';
  } else {
    body += '<p class="hint">Tap any item on the invitation to change, move or remove it. Tap an empty part of a section to change its background or add items.</p>';
    body += '<div class="grp"><span class="lbl">Date and time (Amman)</span><input type="datetime-local" id="evTime" value="' + esc(S.event) + '"><p class="hint">Drives the countdown and calendar link. The date written on the invitation is separate text.</p></div>';
    body += '<div class="grp"><span class="lbl">Place for "Get directions"</span><input type="text" id="evMaps" value="' + esc(S.maps) + '"></div>';
    body += '<div class="grp"><span class="lbl">Add to the last section</span>' + addButtons() + '</div>';
    body += '<div class="rowb"><button class="pbtn" data-do="addsec">' + ico('plus') + 'Add a new section</button></div>';
  }
  const back = (f || sec) ? '<button class="pbtn" data-do="page">Page settings</button>' : '';
  panel.innerHTML = '<div class="phead"><h2>' + title + '</h2>' + back +
    '<button class="pbtn icon" data-do="undo" title="Undo" aria-label="Undo"' + (undoStack.length ? '' : ' disabled') + '>' + ico('undo') + '</button>' +
    '<button class="pbtn icon" data-do="min" title="Minimize" aria-label="Minimize panel">' + ico(panel.classList.contains('min') ? 'max' : 'min') + '</button>' +
    '<button class="pbtn" data-do="cancel">Cancel</button><button class="pbtn primary" data-do="save">Save</button>' +
    '<span class="status" id="status" style="flex-basis:100%"' + (window._status ? '' : ' hidden') + '>' + (window._status||'') + '</span></div>' +
    '<div class="pbody">' + body + '</div>';
  bindPanel(f, sec);
}
function addButtons(){
  const have = t => S.sections.some(s => s.items.some(i => i.t === t));
  const opts = [['text','Text'],['divider','Divider'],['image','Image'],['spacer','Spacer']];
  [['countdown','Countdown'],['calendar','Calendar link'],['directions','Directions'],['rsvp','RSVP']].forEach(o => { if(!have(o[0])) opts.push(o); });
  return '<div class="rowb">' + opts.map(o => '<button class="pbtn" data-add="' + o[0] + '">' + ico('plus') + o[1] + '</button>').join('') + '</div>';
}
function newItem(t){
  const id = uid();
  const base = {
    text:{t:'text', style:'body', size:18, color:'#2A3A4A', txt:{en:{text:'New text'}, ar:{text:'نص جديد'}}},
    divider:{t:'divider', kind:'leaf', w:150, color:'#6E8B63'},
    image:{t:'image', w:80},
    spacer:{t:'spacer', h:40},
    countdown:{t:'countdown', size:50, txt:{en:{days:'Days',hours:'Hours',minutes:'Minutes'}, ar:{days:'أيام',hours:'ساعات',minutes:'دقائق'}}},
    calendar:{t:'calendar', txt:{en:{label:'Add to calendar'}, ar:{label:'أضف إلى التقويم'}}},
    directions:{t:'directions', txt:{en:{label:'Get directions'}, ar:{label:'الاتجاهات'}}},
    rsvp:{t:'rsvp', txt:{en:{btn:'RSVP',fName:'Your name',fGuests:'Number of guests',accept:'Joyfully accept',decline:'Regretfully decline',send:'Send reply',yes:"Thank you, we'll see you there!",no:"Thank you, you'll be missed."},
      ar:{btn:'تأكيد الحضور',fName:'الاسم',fGuests:'عدد الضيوف',accept:'سأحضر بكل سرور',decline:'أعتذر عن الحضور',send:'إرسال الرد',yes:'شكراً لكم، نراكم هناك!',no:'شكراً لكم، سنفتقدكم.'}}}
  }[t];
  return Object.assign({id}, JSON.parse(JSON.stringify(base)));
}
function bindPanel(f, sec){
  const q = s => panel.querySelectorAll(s);
  q('[data-do]').forEach(b => b.onclick = () => panelDo(b.dataset.do, f));
  q('[data-add]').forEach(b => b.onclick = () => {
    snap(); const it = newItem(b.dataset.add);
    const target = sec || (f ? f.sec : S.sections[S.sections.length-1]);
    if(f && f.sec === target) target.items.splice(f.i+1, 0, it); else target.items.push(it);
    sel = it.id; selSec = target.id; commit();
    app.querySelector('[data-id="' + it.id + '"]')?.scrollIntoView({block:'center', behavior:'smooth'});
  });
  if(f){
    const it = f.it;
    q('[data-set]').forEach(s => s.onchange = () => { snap(); it[s.dataset.set] = s.value;
      if(s.dataset.set === 'style'){ it.size = {script:40, hand:18, eyebrow:12, body:17}[s.value]; it.color = {script:'#2A3A4A', hand:'#2A3A4A', eyebrow:'#B8A06A', body:'#6B746F'}[s.value]; } commit(); });
    q('[data-col]').forEach(b => b.onclick = () => { snap(); it.color = b.dataset.col; commit(); });
    q('[data-col-custom]').forEach(i => { i.onchange = () => { snap(); it.color = i.value; commit(); }; });
    q('[data-kind]').forEach(b => b.onclick = () => { snap(); it.kind = b.dataset.kind; commit(); });
    q('[data-toggle]').forEach(b => b.onclick = () => { snap(); it[b.dataset.toggle] = !it[b.dataset.toggle]; commit(); });
    q('[data-align]').forEach(b => b.onclick = () => { snap(); it.align = b.dataset.align; commit(); });
    q('[data-txt]').forEach(i => i.oninput = () => { it.txt[lang] = it.txt[lang] || {}; it.txt[lang][i.dataset.txt] = i.value; });
    q('[data-rng]').forEach(r => {
      r.onpointerdown = r.onkeydown = () => { if(!r._s){ snap(); r._s = 1; } };
      r.oninput = () => { const k = r.dataset.rng; it[k] = k === 'op' ? r.value/100 : +r.value; r.previousElementSibling.lastElementChild.textContent = r.value + ({size:'px',w:it.t==='image'?'%':'px',op:'%',h:'px',mt:'px'})[k];
        const el = app.querySelector('[data-id="' + it.id + '"]'); if(el){ const n = document.createElement('div'); n.innerHTML = itemHTML(it); const ne = n.firstElementChild; if(ne){ el.replaceWith(ne); decorateEdit(); } } };
    });
    const ud = $('upDiv'); if(ud) ud.onchange = async () => { const fl = ud.files[0]; if(!fl) return; try{ const d = await readImage(fl, 900, true); snap(); it.img = d; it.kind = 'image'; commit(); }catch(e){ status('That file could not be read as an image.'); } };
    const ui = $('upImg'); if(ui) ui.onchange = async () => { const fl = ui.files[0]; if(!fl) return; try{ const d = await readImage(fl, 1400, true); snap(); it.img = d; commit(); }catch(e){ status('That file could not be read as an image.'); } };
  }
  if(sec){
    const b = sec.bg = sec.bg || {type:'plain'};
    q('[data-bg]').forEach(x => x.onclick = () => { snap(); b.type = x.dataset.bg; if((b.type==='image'||b.type==='garden') && b.wash == null) b.wash = 20; commit(); if(b.type === 'image' && !b.img) $('upBg')?.click(); });
    q('[data-bgcol]').forEach(x => x.onclick = () => { snap(); b.color = x.dataset.bgcol; commit(); });
    q('[data-bgcol-custom]').forEach(i => i.onchange = () => { snap(); b.color = i.value; commit(); });
    const ub = $('upBg'); if(ub) ub.onchange = async () => { const fl = ub.files[0]; if(!fl) return; status('Preparing image…'); try{ const d = await readImage(fl, 1600, false); snap(); b.img = d; b.type = 'image'; if(b.wash == null) b.wash = 20; status(''); commit(); }catch(e){ status('That file could not be read as an image. Try a JPG or PNG.'); } };
    q('[data-rng]').forEach(r => {
      r.onpointerdown = r.onkeydown = () => { if(!r._s){ snap(); r._s = 1; } };
      r.oninput = () => { const k = r.dataset.rng; if(k === 'wash') b.wash = +r.value; else sec[k] = +r.value; r.previousElementSibling.lastElementChild.textContent = r.value + (k==='wash'?'%':'px');
        const el = app.querySelector('[data-sec="' + sec.id + '"]'); const n = document.createElement('div'); n.innerHTML = secHTML(sec); el.replaceWith(n.firstElementChild); app.querySelectorAll('[data-sec="' + sec.id + '"] canvas.bloom').forEach(drawGarden); tick(); decorateEdit(); };
      r.onchange = () => app.querySelectorAll('[data-sec="' + sec.id + '"] canvas.bloom').forEach(drawGarden);
    });
    q('[data-sdo]').forEach(x => x.onclick = () => {
      const i = S.sections.indexOf(sec), a = x.dataset.sdo; snap();
      if(a === 'up' && i > 0){ S.sections.splice(i,1); S.sections.splice(i-1,0,sec); }
      if(a === 'down' && i < S.sections.length-1){ S.sections.splice(i,1); S.sections.splice(i+1,0,sec); }
      if(a === 'dup'){ const c = JSON.parse(JSON.stringify(sec)); c.id = uid(); c.items.forEach(it => { it.id = uid(); it.role = undefined; }); S.sections.splice(i+1,0,c); selSec = c.id; }
      if(a === 'del'){ if(S.sections.length < 2){ status('The invitation needs at least one section.'); return; } S.sections.splice(i,1); selSec = null; }
      commit(); app.querySelector('[data-sec="' + selSec + '"]')?.scrollIntoView({block:'nearest', behavior:'smooth'});
    });
  }
  const et = $('evTime'); if(et) et.onchange = () => { if(et.value){ snap(); S.event = et.value; render(); } };
  const em = $('evMaps'); if(em) em.onchange = () => { snap(); S.maps = em.value.trim() || S.maps; render(); };
}
function panelDo(a, f){
  if(a === 'page'){ sel = null; selSec = null; markSel(); renderPanel(); }
  if(a === 'min'){ panel.classList.toggle('min'); renderPanel(); }
  if(a === 'undo' && undoStack.length){ S = JSON.parse(undoStack.pop()); if(sel && !find(sel)) sel = null; if(selSec && !secOf(selSec)) selSec = null; commit(); }
  if(a === 'cancel'){ S = JSON.parse(draft); exitEdit(); }
  if(a === 'save') save();
  if(a === 'reset' && f){ snap(); f.it.x = 0; f.it.y = 0; commit(); }
  if(a === 'dup' || a === 'del') itemAction(a);
  if(a === 'addsec'){ snap(); const s = {id:uid(), bg:{type:'plain', color:'#FBFAF5'}, items:[newItem('text')]}; S.sections.push(s); selSec = s.id; sel = null; commit(); app.querySelector('[data-sec="' + s.id + '"]')?.scrollIntoView({behavior:'smooth'}); }
}
function exitEdit(){ editing = false; sel = null; selSec = null; window._status = ''; document.body.classList.remove('editing','editing-page'); panel.hidden = true; $('editFab').hidden = false; render(); }
function status(m){ window._status = m; const s = $('status'); if(s){ s.textContent = m; s.hidden = !m; } }
function readImage(file, max, keepAlpha){
  return new Promise((res, rej) => {
    if(file.type === 'image/svg+xml' && file.size < 400000){ const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); return; }
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width*k)); c.height = Math.max(1, Math.round(img.height*k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      const alpha = keepAlpha && /png|webp|gif/.test(file.type);
      res(alpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', .84));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}
function buildDoc(){
  const reset = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#faf9f5}img{max-width:100%}[hidden]{display:none!important}';
  const json = JSON.stringify(S).replace(/</g, '\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' +
    '<title>' + esc(S.title || 'Wedding invitation') + '</title>\n' + PRISTINE.font + '\n' + PRISTINE.style + '\n\n' + PRISTINE.app + '\n\n' +
    '<script type="application/json" id="state">' + json + '<\/script>\n\n<script>' + SELF + '<\/script></body></html>';
}
async function save(){
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  const btn = panel.querySelector('[data-do="save"]'); btn.disabled = true; status('Saving…');
  try{ await artifactApi.publish(buildDoc()); status('Saved. Reloading…'); }
  catch(err){
    btn.disabled = false; const c = err && err.code;
    if(c === 'conflict') status('A newer version was saved elsewhere. Loading it now.');
    else if(c === 'not_writer' || c === 'not_granted') status('This view is read-only, so changes can’t be saved here.');
    else if(c === 'rate_limited') status('Saving too often. Wait a moment and try again.');
    else status('Couldn’t save (' + (c || 'error') + '). Try again.');
  }
}
})();
